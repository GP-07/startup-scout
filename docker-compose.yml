services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: startup_scout
      POSTGRES_USER: startup_scout
      POSTGRES_PASSWORD: startup_scout
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup_scout -d startup_scout"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://startup_scout:startup_scout@db:5432/startup_scout
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: python manage.py run_huey
    env_file: .env
    environment:
      DATABASE_URL: postgres://startup_scout:startup_scout@db:5432/startup_scout
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
