name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: startup_scout
          POSTGRES_USER: startup_scout
          POSTGRES_PASSWORD: startup_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startup_scout -d startup_scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://startup_scout:startup_scout@localhost:5432/startup_scout
      HUEY_IMMEDIATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
